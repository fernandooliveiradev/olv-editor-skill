<template>
  <!-- Receita: PERGUNTA / PROBLEMA. Copie para compositions/ e troque o prefixo "rp-". -->
  <style>
    #receita-pergunta { position: absolute; inset: 0; background: var(--ground, #0b0b12); }
    #rp-cena { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
    #rp-conteudo {
      width: 900px; display: flex; flex-direction: column; align-items: flex-start;
      gap: 56px; font-family: var(--font-display, Inter, sans-serif);
    }
    #rp-titulo {
      color: var(--ink, #f4f4f5); font-size: 104px; font-weight: 900;
      line-height: 1.0; letter-spacing: -0.035em; max-width: 880px;
    }
    #rp-destaque { position: relative; display: inline-block; white-space: nowrap; }
    #rp-destaque-texto { position: relative; z-index: 1; color: var(--ink, #f4f4f5); }
    #rp-traco { position: absolute; left: -8px; right: -8px; bottom: 6px; height: 26px; border-radius: 3px;
      background: var(--accent, #ff5a3c); transform-origin: left center; z-index: 0; }
    #rp-apoio { color: var(--muted, #a1a1aa); font-size: 52px; font-weight: 500; line-height: 1.2; max-width: 820px; }
    #rp-motivo { position: absolute; left: 90px; bottom: 380px; width: 220px; height: 220px;
      border: 2px solid var(--accent, #ff5a3c); border-radius: 50%; opacity: 0.18; }
  </style>

  <div id="receita-pergunta" data-composition-id="receita-pergunta" data-width="1080" data-height="1920">
    <div id="rp-cena" class="clip" data-start="0" data-duration="4.5" data-track-index="1">
      <div id="rp-conteudo">
        <h1 id="rp-titulo">
          <span class="rp-palavra">Paciente</span>
          <span class="rp-palavra">some</span>
          <span id="rp-destaque" class="rp-palavra"><span id="rp-destaque-texto">depois</span><span id="rp-traco"></span></span>
          <span class="rp-palavra">do</span>
          <span class="rp-palavra">orçamento?</span>
        </h1>
        <p id="rp-apoio">A resposta muda o seu mês.</p>
      </div>
      <div id="rp-motivo" data-layout-ignore></div>
    </div>
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });
    // Palavras: blur-in com stagger de 0,08 s (motion-style §2.1)
    // O gancho já está no frame 0 (o frame 0 é a capa no feed): a entrada é um assentamento,
    // sem opacity 0 — senão o check acusa `first_frame_empty`.
    tl.fromTo(
      "#rp-titulo .rp-palavra",
      { filter: "blur(10px)", y: 22 },
      { filter: "blur(0px)", y: 0, duration: 0.34, ease: "power3.out", stagger: 0.08 },
      0,
    );
    // Traço de ênfase: desenha da esquerda para a direita
    tl.fromTo("#rp-traco", { scaleX: 0 }, { scaleX: 1, duration: 0.34, ease: "power3.out" }, 0.55);
    // Apoio entra depois, no mesmo easing
    tl.fromTo("#rp-apoio", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" }, 0.9);
    tl.fromTo("#rp-motivo", { opacity: 0, scale: 0.8 }, { opacity: 0.18, scale: 1, duration: 0.7, ease: "power2.out" }, 0.25);
    // Saída: 40–50% da entrada, 0,2 s antes do fim
    tl.fromTo("#rp-conteudo", { opacity: 1 }, { opacity: 0, duration: 0.22, ease: "power2.in" }, 4.28);
    window.__timelines["receita-pergunta"] = tl;
  </script>
</template>
