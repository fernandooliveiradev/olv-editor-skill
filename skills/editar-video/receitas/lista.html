<template>
  <!-- Receita: LISTA / CHECKLIST. Troque o prefixo "rl-". Um item por batida. -->
  <style>
    #receita-lista { position: absolute; inset: 0; background: var(--ground, #0b0b12); }
    #rl-cena { position: absolute; inset: 0; }
    #rl-conteudo { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center;
      gap: 44px; padding: 0 90px; font-family: var(--font-display, Inter, sans-serif); }
    #rl-cabecalho { display: flex; align-items: baseline; justify-content: space-between; gap: 24px; }
    #rl-titulo { color: var(--ink, #f4f4f5); font-size: 72px; font-weight: 900; letter-spacing: -0.02em; }
    #rl-contador { color: var(--accent, #ff5a3c); font-size: 52px; font-weight: 800; font-variant-numeric: tabular-nums; }
    #rl-card { display: flex; flex-direction: column; gap: 34px; padding: 56px 52px;
      border-radius: 28px; background: #14141d; border: 1px solid #262634; }
    .rl-item { display: flex; align-items: center; gap: 28px; }
    .rl-icone { width: 56px; height: 56px; flex: 0 0 auto; }
    .rl-icone circle { fill: none; stroke: var(--accent, #ff5a3c); stroke-width: 3; opacity: 0.35; }
    .rl-icone path { fill: none; stroke: var(--accent, #ff5a3c); stroke-width: 4; stroke-linecap: round;
      stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; }
    .rl-texto { color: var(--ink, #f4f4f5); font-size: 50px; font-weight: 600; line-height: 1.15; }
  </style>

  <div id="receita-lista" data-composition-id="receita-lista" data-width="1080" data-height="1920">
    <div id="rl-cena" class="clip" data-start="0" data-duration="5.5" data-track-index="1">
      <div id="rl-conteudo">
        <div id="rl-cabecalho">
          <h2 id="rl-titulo">3 erros que custam cliente</h2>
          <span id="rl-contador">0/3</span>
        </div>
        <div id="rl-card">
          <div class="rl-item" data-item="1">
            <svg class="rl-icone" viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="26"></circle><path pathLength="1" d="M16 29 L24 37 L40 19"></path></svg>
            <span class="rl-texto">Responder em 6 horas</span>
          </div>
          <div class="rl-item" data-item="2">
            <svg class="rl-icone" viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="26"></circle><path pathLength="1" d="M16 29 L24 37 L40 19"></path></svg>
            <span class="rl-texto">Orçamento sem próximo passo</span>
          </div>
          <div class="rl-item" data-item="3">
            <svg class="rl-icone" viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="26"></circle><path pathLength="1" d="M16 29 L24 37 L40 19"></path></svg>
            <span class="rl-texto">Nenhum retorno em 48 h</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });
    const itens = gsap.utils.toArray(".rl-item");

    tl.fromTo("#rl-titulo", { y: 24 }, { y: 0, duration: 0.5, ease: "power3.out" }, 0);
    tl.fromTo("#rl-card", { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.35);

    // Um item por batida: check desenhado + contador
    itens.forEach((item, i) => {
      const t = 0.9 + i * 0.55;
      tl.fromTo(item, { opacity: 0, x: -18 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, t);
      tl.fromTo(item.querySelector("path"), { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.32, ease: "power2.out", autoRound: false }, t + 0.08);
    });

    // Contador: tween em degraus (determinístico no seek), não callback solto
    const cont = { n: 0 };
    tl.fromTo(cont, { n: 0 }, {
      n: 3, duration: 1.66, ease: "steps(3)",
      onUpdate: () => { document.querySelector("#rl-contador").textContent = `${Math.round(cont.n)}/3`; },
    }, 0.9);

    tl.fromTo("#rl-conteudo", { opacity: 1 }, { opacity: 0, duration: 0.24, ease: "power2.in" }, 5.26);
    window.__timelines["receita-lista"] = tl;
  </script>
</template>
